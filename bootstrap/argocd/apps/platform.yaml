apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: ptic-platform, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/foraws-oss/ptic-gitops.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
