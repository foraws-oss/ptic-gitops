apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ptic-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/foraws-oss/ptic-gitops.git
    targetRevision: main
    path: environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
