apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: networking
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.10.0
          args: [tunnel, --no-autoupdate, run, --token, "$(TUNNEL_TOKEN)"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: token } }
          readinessProbe: { tcpSocket: { port: 2000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /ready, port: 2000 }, initialDelaySeconds: 10 }
          ports: [{ name: metrics, containerPort: 2000 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: networking
  labels: { app: cloudflared }
spec:
  selector: { app: cloudflared }
  ports: [{ name: metrics, port: 2000, targetPort: metrics }]
