apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: staging-apps
  namespace: staging
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking
  hostnames:
    - staging.example.com
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: frontend, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: staging-api
  namespace: staging
spec:
  parentRefs:
    - name: public-gateway
      namespace: networking
  hostnames:
    - staging-api.example.com
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: backend, port: 80 }]
