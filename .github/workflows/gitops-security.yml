```yaml
name: GitOps Security & Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: semgrep/semgrep-action@v1
        with:
          config: p/default

  iac-scan:
    name: IaC scan (Checkov + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Checkov Kubernetes scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes
          soft_fail: true

      - name: Build rendered manifests for Trivy
        run: |
          mkdir -p .ci-rendered
          for env in dev staging prod; do
            kustomize build "environments/${env}" \
              > ".ci-rendered/${env}.yaml"
          done
          kustomize build platform \
            > .ci-rendered/platform.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .ci-rendered
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  manifest-validation:
    name: Kustomize build + kubeconform
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build rendered manifest
        run: |
          mkdir -p .ci-rendered
          kustomize build environments/${{ matrix.environment }} \
            > .ci-rendered/${{ matrix.environment }}.yaml

      - name: Install Kubeconform
        run: |
          set -euo pipefail
          VERSION=v0.8.0
          mkdir -p "$HOME/.local/bin"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          install -m 0755 /tmp/kubeconform "$HOME/.local/bin/kubeconform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifest schema
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            ".ci-rendered/${{ matrix.environment }}.yaml"

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/dependency-review-action@v4
```